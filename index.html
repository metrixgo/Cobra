<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobra — Block Python</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand"><span class="brand-mark">C</span><span>Cobra</span><small>Block Python</small></div>
      <div class="actions"><button id="runButton" class="button primary">Run</button><button id="exportButton" class="button">Export .py</button><button id="clearButton" class="button quiet">Clear</button></div>
    </header>
    <main class="app-shell">
      <section class="editor-panel">
        <div class="panel-heading"><span>Blocks</span><span class="hint">Drag a block into the canvas</span></div>
        <div class="builder">
          <aside class="palette" aria-label="Block palette">
            <p class="palette-label">ACTIONS</p>
            <div class="palette-block print" draggable="true" data-new="print">print text</div>
            <div class="palette-block ask" draggable="true" data-new="ask">ask for input</div>
            <div class="palette-block note" draggable="true" data-new="comment">comment</div>
            <p class="palette-label">LOGIC</p>
            <div class="palette-block loop" draggable="true" data-new="count">count from to</div>
            <div class="palette-block logic" draggable="true" data-new="if">if condition</div>
            <p class="palette-label">VARIABLES</p>
            <div class="palette-block variable" draggable="true" data-new="set">set variable</div>
            <div class="palette-block variable" draggable="true" data-new="change">change variable</div>
          </aside>
          <div id="canvas" class="canvas" aria-label="Program canvas"><div class="stack root-stack" data-stack="root"></div></div>
        </div>
      </section>
      <aside class="code-panel">
        <div class="panel-heading"><span>Python</span><span class="status">Live</span></div>
        <pre id="pythonCode"></pre>
        <section class="output-panel"><div class="output-heading">Output <button id="clearOutput">Clear</button></div><pre id="programOutput">Run your blocks to see output here.</pre></section>
      </aside>
    </main>
    <script src="app.js"></script>
  </body>
</html>
